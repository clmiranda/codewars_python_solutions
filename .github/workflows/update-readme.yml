name: Update README katas count

on:
  push:
    branches: [main]
    paths:
      - "*-kyu/**"
      - "scripts/update_readme_katas.py"

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Update katas count in README
        run: python scripts/update_readme_katas.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet README.md; then
            exit 0
          fi
          git add README.md
          git commit -m "Update katas count in README"
          git push
